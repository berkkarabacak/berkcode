# Step 1 of 2: only what certbot needs to get the certificate for agents.berkkarabacak.com.
# Replace it with agents.berkkarabacak.com.conf once the certificate exists (see deploy/README.md).
server {
    listen 80;
    listen [::]:80;
    server_name agents.berkkarabacak.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
