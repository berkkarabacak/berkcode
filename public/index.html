<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Agent Runner</title>
  <link rel="icon" href="/icon.ico" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Projects and conversations">
      <div class="side-top">
        <a href="#/" class="brand"><img src="/icon.png" alt="" width="22" height="22" /><span>Claude Agent Runner</span></a>
        <button class="icon-btn side-close" id="side-close" aria-label="Hide projects">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <a class="side-new-project" href="#/new">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New project
      </a>
      <div class="side-label">Projects</div>
      <nav class="side-projects" id="side-projects"></nav>
      <nav class="side-nav" aria-label="App">
        <a href="#/schedules" data-nav="schedules">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Scheduled tasks
        </a>
        <a href="#/settings" data-nav="settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
          Settings
        </a>
      </nav>
    </aside>
    <div class="side-backdrop" id="side-backdrop"></div>
    <main class="main">
      <div id="banner"></div>
      <div id="view" class="view page-view"><p class="muted">Loading…</p></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="/vendor/marked.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
